# Column layout of the "Approved Data" sheet in the Excel export.
#
# Copied from the Shega bank timeseries spreadsheet (final_timeseries_all_banks.csv,
# header row, 2026-10-22) so exported rows can be pasted straight into it.
#
# bank_column / year_column  where the bank name and the fiscal year (YYYY/YY) go
# columns                    every column, in order, exactly as in the spreadsheet
# calculated                 columns a data analyst calculates from the approved figures and
#                            enters on the Calculations page (the app never calculates)
#
# Every other column is extracted: a metric in metrics.yaml fills it through its
# `export_column`, after review in Extract & Review.

bank_column: bank
year_column: fiscal_year

calculated:
  - "Profit Before Tax (Calculated)"
  - "Profit After Tax (Calculated)"
  - "Basic Earning per 1 share (EPS) (Calculated)"
  - "Return on Assets (ROA) (Calculated)"
  - "Return on Equity (ROE) (Calculated)"
  - "Average Total Asset"
  - "Cost to Income Ratio"
  - "Net Interest Margin"
  - "Asset Utilization Ratio"
  - "Profit Margin"
  - "Dividend Payout Ratio (Dividends Paid/Net Profit)"
  - "Dividend Payout Ratio (Dividends paid/Total deposits)"
  - "Loan-to-Deposit Ratio"
  - "Liquidity Ratio"
  - "Capital Adequacy Ratio"
  - "Leverage Ratio"
  - "Equity-to-Asset Ratio"
  - "Deposit per Account Holder"
  - "Deposit Growth Rate"
  - "Digital Penetration Rate (Excluding Card Banking)"
  - "Digital Penetration Rate (Including Card Banking)"
  - "Deposit per Branch"
  - "Deposits per Employee"
  - "ATM-to-Branch Ratio"
  - "Agents-to-Branch Ratio"
  - "Customers per Branch"

