[client]
# Hide Streamlit's developer options (Rerun, Clear caches, Deploy) from the menu.
# This also switches off the single-key "c" shortcut, which opened the Clear caches
# dialog when someone typed while no input box had focus. In Streamlit 1.66 the
# frontend only opens that dialog when developer options are shown, and "viewer"
# turns them off. There is no setting for the "r" (rerun) shortcut; a rerun keeps
# all entered data, like clicking any button. Developers can still get the full menu
# with: streamlit run app.py --client.toolbarMode=developer
toolbarMode = "viewer"

[browser]
# No telemetry (docs/security-and-privacy.md): Streamlit sends usage stats unless disabled.
gatherUsageStats = false

[server]
# Matches max_upload_mb in config/settings.yaml; the app also enforces that limit.
maxUploadSize = 100
# Fixed, so the Evidence links in exported Excel files (app_url in config/settings.yaml) keep
# working: without it Streamlit moves to 8502 when 8501 is busy.
port = 8501
# Serves static/ at app/static/: the IBM Plex font files of the theme (no font is fetched
# from another site, docs/security-and-privacy.md).
enableStaticServing = true

# The redesign's look (D-090): cool grey ground, white panels with thin borders, one deep
# blue for actions, IBM Plex Sans for text and IBM Plex Mono for numbers. Details that the
# theme cannot set are in src/ui/style.py.
[theme]
base = "light"
primaryColor = "#2747C9"
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#F9FAFB"
textColor = "#15181E"
linkColor = "#2747C9"
borderColor = "#E3E6EB"
baseRadius = "medium"
showWidgetBorder = true
baseFontSize = 15
font = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
headingFontSizes = ["1.75rem", "1.5rem", "1.2rem", "1.05rem", "0.95rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-500-normal.woff2"
weight = 500

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F9FAFB"
textColor = "#4B5363"
primaryColor = "#2747C9"
borderColor = "#E3E6EB"
